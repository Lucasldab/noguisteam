[package]
name = "noguisteam"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noguisteam"
path = "src/main.rs"

[dependencies]
# TUI
ratatui        = "0.27"
crossterm      = "0.27"

# Database
rusqlite       = { version = "0.31", features = ["bundled"] }

# HTTP + async
reqwest        = { version = "0.12", features = ["json", "blocking"] }
tokio          = { version = "1",    features = ["full"] }

# Serialization
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# Env / config
dotenv         = "0.15"

# Error handling
anyhow         = "1"

# Config
toml           = "0.8"

[profile.release]
strip     = true
opt-level = "z"
lto       = true

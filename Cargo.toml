[package]
name = "noguisteam"
version = "0.3.0"
edition = "2021"
description = "Terminal UI for a Steam library: install, uninstall, launch and watch wishlist sales via SteamCMD"
license = "MIT"
repository = "https://github.com/Lucasldab/noguisteam"
readme = "README.md"
keywords = ["steam", "steamcmd", "tui", "ratatui"]
categories = ["command-line-utilities", "games"]
exclude = ["SCAN.md"]

[[bin]]
name = "noguisteam"
path = "src/main.rs"

[dependencies]
# TUI
ratatui        = "0.30"
crossterm      = "0.29"
ratatui-image  = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
image          = { version = "0.25", default-features = false, features = ["jpeg"] }

# Database
rusqlite       = { version = "0.31", features = ["bundled"] }

# HTTP (blocking only — no tokio runtime needed)
reqwest        = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Serialization
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# Env / config
dotenv         = "0.15"

# Error handling
anyhow         = "1"

[profile.release]
strip     = true
opt-level = "z"
lto       = true

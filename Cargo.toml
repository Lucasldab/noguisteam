[package]
name = "noguisteam"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noguisteam"
path = "src/main.rs"

[dependencies]
# TUI
ratatui        = "0.27"
crossterm      = "0.27"

# Database
rusqlite       = { version = "0.31", features = ["bundled"] }

# HTTP (blocking only — no tokio runtime needed)
reqwest        = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# Serialization
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"

# Env / config
dotenv         = "0.15"

# Error handling
anyhow         = "1"

[profile.release]
strip     = true
opt-level = "z"
lto       = true
